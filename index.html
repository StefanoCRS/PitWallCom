<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Wall Comms</title>
<style>
:root{--bg:#f3f3f0;--fg:#161616;--card:#fff;--bd:#c9c9c2;--mut:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f1f1f1;--card:#1c1c1c;--bd:#3a3a3a;--mut:#9a9a9a}}
:root[data-theme="dark"]{--bg:#111;--fg:#f1f1f1;--card:#1c1c1c;--bd:#3a3a3a;--mut:#9a9a9a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}
.scr{container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;font-weight:900;line-height:1;letter-spacing:.01em}
.scr .big{padding:0 4cqw;overflow-wrap:anywhere}
.scr .num{position:absolute;right:3cqw;bottom:3cqh;font-size:8cqw;padding:1cqh 2.5cqw;border-radius:1.2cqw;background:#000;color:#fff;outline:.4cqw solid rgba(255,255,255,.75)}
.scr .bignum{font-size:38cqw;opacity:.45}
.scr .idle{font-size:5cqw;opacity:.35;font-weight:700;margin-top:2cqh}
.pos{width:100%;height:100%;display:flex;flex-direction:column}
.pos div{flex:1;display:flex;align-items:center;justify-content:center;font-size:min(26cqh,12cqw);white-space:nowrap}
.age{position:absolute;right:2cqw;top:1.5cqh;font-size:3cqw;font-weight:600;opacity:.5}
/* pilota */
#pilot{position:fixed;inset:0;z-index:5}
#pilot .scr{width:100%;height:100%}
#dot{position:fixed;left:10px;bottom:10px;width:12px;height:12px;border-radius:50%;background:#c62828;z-index:9;opacity:.8}
#dot.ok{background:#2e7d32}
#menub{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9;width:52px;height:52px;border-radius:12px;border:2px solid #888;background:rgba(128,128,128,.35);color:#fff;font-size:26px}
#menu{position:fixed;left:10px;top:calc(72px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-direction:column;gap:8px;background:#222;border:2px solid #666;border-radius:14px;padding:10px}
#menu button{font-size:20px;font-weight:700;padding:16px 22px;border-radius:10px;border:0;background:#fff;color:#000;text-align:left}
#start{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:22px;text-align:center;padding:20px}
#start button{font-size:28px;font-weight:800;padding:22px 44px;border-radius:14px;border:0;background:#ffd400;color:#000}
#start .n{font-size:90px;font-weight:900}
/* box */
.wrap{max-width:1500px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 8px}
.stat{font-size:13px;color:var(--mut)}
.stat b{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c62828;margin-right:6px}
.stat.ok b{background:#2e7d32}
.card{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
details.card summary{cursor:pointer;font-weight:700}
.cfg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:10px}
.cfg div{display:flex;gap:10px;align-items:center}
.cfg input[type=checkbox]{width:24px;height:24px;flex:none}
.cfg input[type=text]{width:90px;padding:8px;font-size:18px;text-transform:uppercase}
.cars{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));margin-top:12px}
.cars .card{margin:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chead .n{font-size:34px;font-weight:900}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.s{grid-template-columns:repeat(2,1fr)}
.grid button{min-height:56px;border-radius:10px;border:2px solid var(--bd);font-weight:800;font-size:15px;cursor:pointer;background:var(--card);color:var(--fg)}
.grid button:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
input{padding:10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--fg);font-size:17px;width:100%}
.row input{flex:1;min-width:70px}
.go{padding:12px 16px;border-radius:10px;border:0;background:#1565c0;color:#fff;font-weight:800;cursor:pointer;font-size:14px}
.go.wa{background:#1fa855}.go.gr{background:#555}
.prev{width:100%;aspect-ratio:16/10;border-radius:10px;border:2px solid var(--bd);margin:8px 0}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.warn{color:#c62828;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var RELAY="https://ntfy.sh/"; /* servizio gratuito di messaggistica: cambia qui se usi un tuo server ntfy */
var GFLAGS={red:["ROSSA","#e10600","#fff"],yellow:["GIALLA","#ffd400","#000"],green:["VERDE","#00a651","#fff"],blue:["BLU","#0057ff","#fff"],check:["SCACCHI","","#fff"]};
var CFLAGS={black:["NERA","#000","#fff"],bo:["NERA ARANCIO","#000","#ff7a00"],wb:["BIANCO NERA","",""]};
var TXT={pitnow:"PIT NOW",pitnext:"PIT NEXT LAP",last:"LAST LAP",cool:"COOL DOWN",push:"PUSH",fcy:"FCY",sc:"SC",scin:"SAFETY CAR IN THIS LAP"};
var YEL={fcy:1,sc:1};
var CAR_TXT=["pitnow","pitnext","last","cool","push"],GEN_TXT=["fcy","sc","scin"];
var CHECK="repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/22cqmin 22cqmin";
var WB="linear-gradient(to bottom right,#fff 50%,#000 50%)";
var BO="radial-gradient(circle at 50% 50%,#ff7a00 0 30cqmin,#000 30.5cqmin)";

var mem={};
var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
        set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
function h(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function fs(s){var n=s.length;return n<=5?"30cqw":n<=8?"22cqw":n<=12?"15cqw":n<=20?"11cqw":n<=36?"8cqw":"6cqw"}
function fmtGap(v){v=String(v||"").trim();if(!v)return "—";return /^[+\-−]/.test(v)?v.replace("-","−"):v}
function cleanN(v){return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4)}
function newCode(){var a=new Uint8Array(10),s="";window.crypto.getRandomValues(a);
 for(var i=0;i<a.length;i++)s+="abcdefghjkmnpqrstuvwxyz23456789"[a[i]%31];return s}

/* ---- disegno dei messaggi ---- */
function render(el,m,th,num){
 var D=th==="light"?["#fff","#000"]:["#000","#fff"];
 el.replaceChildren();el.className=el.dataset.cls||"scr";el.style.background=D[0];el.style.color=D[1];
 if(!m||m.k==="clear"){el.appendChild(h("div","bignum",num||""));el.appendChild(h("div","idle","BOX COLLEGATO"));return}
 if(m.k==="flag"){
  var f=GFLAGS[m.v]||CFLAGS[m.v];if(!f)return;
  if(m.v==="check")el.style.background=CHECK;
  else if(m.v==="wb")el.style.background=WB;
  else if(m.v==="bo")el.style.background=BO;
  else el.style.background=f[1];
 }else if(m.k==="txt"||m.k==="free"){
  var s=m.k==="txt"?(TXT[m.v]||""):String(m.t||"").toUpperCase();
  if(m.k==="txt"&&YEL[m.v]){el.style.background="#ffd400";el.style.color="#000"}
  var t2=h("div","big",s);t2.style.fontSize=fs(s);el.appendChild(t2);
 }else if(m.k==="pos"){
  var w=h("div","pos");
  w.appendChild(h("div",null,"P"+m.p));
  w.appendChild(h("div",null,"▲ "+fmtGap(m.a)));
  w.appendChild(h("div",null,"▼ "+fmtGap(m.b)));
  el.appendChild(w);
 }
 if(num)el.appendChild(h("div","num",num));
 if(m.seq){var ag=h("div","age","");ag.dataset.seq=m.seq;el.appendChild(ag)}
}
setInterval(function(){
 document.querySelectorAll(".age").forEach(function(a){
  var s=Math.max(0,Math.round((Date.now()-Number(a.dataset.seq))/1000));
  a.textContent=s<90?s+"s":Math.floor(s/60)+"m";
 });
},1000);

/* ---- rete (relay ntfy.sh) e archivio messaggi ---- */
var CODE=null,subs=[],statusCb=null,sendCb=null,es=null,wd=null;
var seen={},lastAll=null,per={},thNow="dark",thSeq=0;
function topicUrl(){return RELAY+"pw-"+CODE}
function effective(n){var a=lastAll,b=per[n];return b&&(!a||b.seq>=a.seq)?b:a}
function setMsg(m){
 if(!m||!m.id||seen[m.id])return;seen[m.id]=1;
 if(m.th&&m.seq>=thSeq){thNow=m.th;thSeq=m.seq}
 if(m.k!=="theme"){
  if(m.c==="*"){if(!lastAll||m.seq>=lastAll.seq)lastAll=m}
  else if(m.c){if(!per[m.c]||m.seq>=per[m.c].seq)per[m.c]=m}
 }
 subs.forEach(function(f){f(m)});
}
function arm(){clearTimeout(wd);wd=setTimeout(connect,100000)}
function connect(){
 if(es){es.close();es=null}clearTimeout(wd);
 if(!CODE)return;
 es=new EventSource(topicUrl()+"/sse?since=1h");
 es.onopen=function(){statusCb&&statusCb(true);arm()};
 es.onerror=function(){statusCb&&statusCb(false)};
 es.addEventListener("keepalive",arm);
 es.onmessage=function(e){
  arm();
  try{
   var d=JSON.parse(e.data);if(d.event!=="message"||!d.message)return;
   var m=JSON.parse(d.message);m.seq=(d.time||0)*1000||Date.now();setMsg(m);
  }catch(_){}
 };
}
function send(m){
 m.id=Math.random().toString(36).slice(2);m.seq=Date.now();m.th=ls.get("pw-th")||"dark";
 setMsg(m);
 fetch(topicUrl(),{method:"POST",body:JSON.stringify(m)})
  .then(function(r){sendCb&&sendCb(r.ok)}).catch(function(){sendCb&&sendCb(false)});
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&es)connect()});

/* ---- vista pilota ---- */
var actx=null;
function beep(){
 try{if(actx){var o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=880;g.gain.value=.25;
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.18)}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
}
function pilotView(root,N){
 var scr=h("div","scr"),box=h("div");box.id="pilot";box.appendChild(scr);
 var dot=h("div");dot.id="dot";
 var mb=h("button",null,"☰");mb.id="menub";mb.setAttribute("aria-label","Menu");
 var menuEl=null,mt=null;
 function th(){var l=ls.get("pw-pth")||"auto";return l!=="auto"?l:thNow}
 function redraw(){render(scr,effective(N),th(),N)}
 function closeMenu(){if(menuEl){menuEl.remove();menuEl=null}clearTimeout(mt)}
 function openMenu(){
  closeMenu();menuEl=h("div");menuEl.id="menu";
  function bt(txt,fn,keep){var b=h("button",null,txt);b.onclick=function(){fn();if(!keep)closeMenu();else openMenu()};menuEl.appendChild(b)}
  bt("‹ Indietro al Box",function(){ls.set("pw-code",CODE);location.hash="#b"});
  var l=ls.get("pw-pth")||"auto";
  bt("Tema: "+(l==="auto"?"AUTO (dal box)":l==="dark"?"NOTTE (bianco su nero)":"GIORNO (nero su bianco)"),function(){
   ls.set("pw-pth",l==="auto"?"dark":l==="dark"?"light":"auto");redraw()},true);
  bt("Schermo intero",function(){try{document.documentElement.requestFullscreen()}catch(e){}});
  bt("Chiudi menu",function(){});
  document.body.appendChild(menuEl);mt=setTimeout(closeMenu,7000);
 }
 mb.onclick=function(){menuEl?closeMenu():openMenu()};
 var st=h("div");st.id="start";
 st.appendChild(h("div",null,"Display pilota"));st.appendChild(h("div","n","#"+N));
 var btn=h("button",null,"TOCCA PER AVVIARE");st.appendChild(btn);
 st.appendChild(h("div",null,"Attiva schermo intero, suono e blocco spegnimento schermo"));
 btn.onclick=async function(){
  try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{await document.documentElement.requestFullscreen()}catch(e){}
  try{if(navigator.wakeLock){await navigator.wakeLock.request("screen");
   document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")navigator.wakeLock.request("screen").catch(function(){})})}}catch(e){}
  st.remove();
 };
 root.append(box,dot,mb,st);
 subs=[function(m){
  var mine=m.c==="*"||m.c===N;
  if(m.k==="theme"||mine)redraw();
  if(mine&&m.k!=="theme"&&m.k!=="clear"&&!m.silent&&Date.now()-m.seq<6000)beep();
 }];
 statusCb=function(ok){dot.className=ok?"ok":""};
 redraw();connect();
}

/* ---- vista box ---- */
function cfg(){
 try{var c=JSON.parse(ls.get("pw-cfg"));if(c&&c.length===4)return c}catch(e){}
 return [{on:true,n:"1"},{on:false,n:"2"},{on:false,n:"3"},{on:false,n:"4"}];
}
function boxView(root){
 var wrap=h("div","wrap"),prevs=[];
 var hd=h("header");hd.appendChild(h("h1",null,"Pit Wall — Comunicazioni"));
 var stat=h("span","stat");stat.appendChild(h("b"));var stt=h("span",null,"connessione…");stat.appendChild(stt);hd.appendChild(stat);wrap.appendChild(hd);
 statusCb=function(ok){stat.className="stat"+(ok?" ok":"");stt.textContent=ok?"online":"offline — controlla la rete"};
 sendCb=function(ok){if(!ok){stat.className="stat";stt.textContent="INVIO FALLITO — controlla la rete"}else if(stat.className.indexOf("ok")<0){stat.className="stat ok";stt.textContent="online"}};
 if(location.protocol==="file:")wrap.appendChild(h("div","note warn","Pagina aperta da file locale: per condividere i link pilota carica prima il file online."));
 function boxTh(){return ls.get("pw-th")||"dark"}
 function refresh(){prevs.forEach(function(p){render(p.el,effective(p.n),boxTh(),p.n)})}

 /* impostazioni */
 var det=h("details","card"),sm=h("summary",null,"⚙ Impostazioni vetture");det.appendChild(sm);
 var cg=h("div","cfg"),dup=h("div","note");det.appendChild(cg);det.appendChild(dup);
 var carsEl=h("div","cars");
 function save(c){ls.set("pw-cfg",JSON.stringify(c))}
 function checkDup(){
  var c=cfg().filter(function(x){return x.on&&x.n}),seenN={},d=false;
  c.forEach(function(x){if(seenN[x.n])d=true;seenN[x.n]=1});
  dup.className="note"+(d?" warn":"");dup.textContent=d?"Attenzione: due vetture hanno lo stesso numero di gara.":"Attiva le vetture che gestisci e scrivi il numero di gara (max 4 caratteri). Se cambi un numero, rimanda il link al pilota.";
 }
 cfg().forEach(function(c,i){
  var d=h("div"),cb=h("input");cb.type="checkbox";cb.checked=c.on;
  var lb=h("span",null,"Vettura "+(i+1)),ni=h("input");ni.type="text";ni.maxLength=4;ni.value=c.n;ni.placeholder="N°";
  cb.onchange=function(){var x=cfg();x[i].on=cb.checked;save(x);buildCars();checkDup()};
  ni.onchange=function(){var x=cfg();x[i].n=cleanN(ni.value);ni.value=x[i].n;save(x);buildCars();checkDup()};
  d.append(cb,lb,ni);cg.appendChild(d);
 });
 checkDup();wrap.appendChild(det);

 /* generale */
 var gc=h("div","card");gc.appendChild(h("h2",null,"Generale — tutte le vetture"));
 gc.firstChild.style.marginTop="0";
 var g1=h("div","grid");
 var sty={red:["#e10600","#fff"],yellow:["#ffd400","#000"],green:["#00a651","#fff"],blue:["#0057ff","#fff"]};
 Object.keys(GFLAGS).forEach(function(k){
  var b=h("button",null,GFLAGS[k][0]);
  if(sty[k]){b.style.background=sty[k][0];b.style.color=sty[k][1];b.style.borderColor=sty[k][0]}
  if(k==="check"){b.style.background=CHECK.replace(/22cqmin/g,"16px");b.style.color="#000";b.style.textShadow="0 0 6px #fff,0 0 6px #fff"}
  b.onclick=function(){send({k:"flag",v:k,c:"*"})};g1.appendChild(b);
 });
 gc.appendChild(g1);
 var g2=h("div","grid");g2.style.marginTop="8px";
 GEN_TXT.forEach(function(k){
  var b=h("button",null,TXT[k]);
  if(YEL[k]){b.style.background="#ffd400";b.style.color="#000";b.style.borderColor="#ffd400"}
  b.onclick=function(){send({k:"txt",v:k,c:"*"})};g2.appendChild(b);
 });
 gc.appendChild(g2);
 var r0=h("div","row");
 var clrAll=h("button","go gr","PULISCI TUTTI");clrAll.onclick=function(){send({k:"clear",c:"*"})};
 var thb=h("button","go gr","");
 function thLabel(){thb.textContent=boxTh()==="dark"?"☾ NOTTE: bianco su nero":"☀ GIORNO: nero su bianco"}
 thb.onclick=function(){ls.set("pw-th",boxTh()==="dark"?"light":"dark");thLabel();send({k:"theme",c:"*",th:boxTh()});refresh()};
 thLabel();r0.append(clrAll,thb);gc.appendChild(r0);
 wrap.appendChild(gc);
 wrap.appendChild(carsEl);

 /* schede vettura */
 function carLink(n){return location.href.split("#")[0]+"#p="+CODE+"&n="+encodeURIComponent(n)}
 function buildCars(){
  carsEl.replaceChildren();prevs.length=0;
  var act=cfg().filter(function(x){return x.on&&x.n});
  if(!act.length){carsEl.appendChild(h("div","note","Nessuna vettura attiva: aprila da ⚙ Impostazioni vetture."))}
  act.forEach(function(c){
   var n=c.n,card=h("div","card"),hh=h("div","chead");
   hh.appendChild(h("div","n","#"+n));
   var lr=h("div","row");lr.style.margin="0";
   var wa=h("button","go wa","WHATSAPP");
   wa.onclick=function(){window.open("https://wa.me/?text="+encodeURIComponent("Display pilota #"+n+": "+carLink(n)),"_blank")};
   var cp=h("button","go gr","COPIA LINK");
   cp.onclick=function(){
    var link=carLink(n);
    function ok(){cp.textContent="COPIATO ✓";setTimeout(function(){cp.textContent="COPIA LINK"},1800)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(ok).catch(function(){prompt("Copia il link:",link)});
    else prompt("Copia il link:",link);
   };
   var op=h("button","go gr","APRI");op.onclick=function(){location.hash="#p="+CODE+"&n="+encodeURIComponent(n)};
   lr.append(wa,cp,op);hh.appendChild(lr);card.appendChild(hh);
   var pv=h("div","scr prev");pv.dataset.cls="scr prev";card.appendChild(pv);prevs.push({el:pv,n:n});

   var gt=h("div","grid s");
   CAR_TXT.forEach(function(k){var b=h("button",null,TXT[k]);b.onclick=function(){send({k:"txt",v:k,c:n})};gt.appendChild(b)});
   card.appendChild(gt);
   var gf=h("div","grid s");gf.style.marginTop="8px";
   Object.keys(CFLAGS).forEach(function(k){
    var b=h("button",null,CFLAGS[k][0]);
    if(k==="black"){b.style.background="#000";b.style.color="#fff";b.style.borderColor="#000"}
    if(k==="bo"){b.style.background="#000";b.style.color="#ff7a00";b.style.borderColor="#ff7a00"}
    if(k==="wb"){b.style.background=WB;b.style.color="#888";b.style.textShadow="0 0 4px #fff,0 0 4px #000"}
    b.onclick=function(){send({k:"flag",v:k,c:n})};gf.appendChild(b);
   });
   card.appendChild(gf);

   var r=h("div","row");
   function fld(ph,mode){var i=h("input");i.placeholder=ph;i.inputMode=mode;i.autocomplete="off";r.appendChild(i);return i}
   var ip=fld("POS","numeric"),ia=fld("▲ +1.2","text"),ib=fld("▼ −0.8","text");
   var sp=h("button","go","INVIA POS");
   sp.onclick=function(){var p=parseInt(ip.value,10);if(!p||p<1)return ip.focus();send({k:"pos",p:p,a:ia.value,b:ib.value,c:n})};
   r.appendChild(sp);card.appendChild(r);
   var r2=h("div","row"),fi=h("input");fi.placeholder="Messaggio libero…";fi.maxLength=60;fi.autocomplete="off";
   var sf=h("button","go","INVIA");
   sf.onclick=function(){if(fi.value.trim()){send({k:"free",t:fi.value.trim(),c:n});fi.value=""}};
   fi.onkeydown=function(e){if(e.key==="Enter")sf.onclick()};
   var cl=h("button","go gr","PULISCI");cl.onclick=function(){send({k:"clear",c:n})};
   r2.append(fi,sf,cl);card.appendChild(r2);
   carsEl.appendChild(card);
  });
  refresh();
 }
 wrap.appendChild(h("div","note","Distacchi in secondi, es. +1.2 / −0.8. Il pilota vede il messaggio finché non ne arriva un altro o premi PULISCI; in alto a destra c’è da quanti secondi è arrivato."));
 root.appendChild(wrap);
 subs=[function(){refresh()}];
 buildCars();connect();
}

function route(){
 var root=document.getElementById("app");
 if(es){es.close();es=null}clearTimeout(wd);
 root.replaceChildren();subs=[];statusCb=null;sendCb=null;
 var m=/^#p=([a-z0-9]{6,32})(?:&n=([A-Za-z0-9]{1,4}))?$/.exec(location.hash);
 if(m){
  CODE=m[1];
  if(m[2])pilotView(root,cleanN(m[2]));
